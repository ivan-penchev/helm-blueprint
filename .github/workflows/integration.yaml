name: Integration Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: integration-test-runner/go.mod
          cache: true
          cache-dependency-path: |
            integration-test-runner/go.sum
            integration-test-runner/go.mod

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Setup kind
        uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Run integration tests
        working-directory: integration-test-runner
        run: |
          go run . --namespace-prefix hb-it

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== Namespaces used by tests ==="
          kubectl get ns -o name 2>/dev/null | grep '^namespace/hb-it-' || true

          for ns in $(kubectl get ns -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null | grep '^hb-it-'); do
            echo "=== Events in $ns ==="
            kubectl get events -n "$ns" --sort-by='.lastTimestamp' 2>/dev/null || true
            echo "=== Resources in $ns ==="
            kubectl get all -n "$ns" 2>/dev/null || true
            echo ""
          done

          echo ""
          echo "=== All resources ==="
          kubectl get all -A 2>/dev/null || true
          echo ""
          echo "=== Failed pods ==="
          kubectl get pods -A --field-selector=status.phase!=Running,status.phase!=Succeeded 2>/dev/null | while read -r ns name rest; do
            [ "$ns" = "NAMESPACE" ] && continue
            echo "--- Describing $ns/$name ---"
            kubectl describe pod "$name" -n "$ns" 2>/dev/null || true
          done
