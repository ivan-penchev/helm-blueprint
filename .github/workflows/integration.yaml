name: Integration Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: integration-test-runner/go.mod
          cache: true
          cache-dependency-path: |
            integration-test-runner/go.sum
            integration-test-runner/go.mod

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Setup kind
        uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Run integration tests
        working-directory: integration-test-runner
        run: |
          go run . --namespace-prefix hb-it